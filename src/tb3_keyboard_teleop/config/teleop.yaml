keyboard_teleop:
  ros__parameters:
    cmd_vel_topic: /cmd_vel
    max_linear: 0.22     # TurtleBot3 burger limit (m/s)
    max_angular: 2.84    # TurtleBot3 burger limit (rad/s)
    linear_step: 0.02
    angular_step: 0.2
    start_linear: 0.12
    start_angular: 1.0
    linear_accel: 0.5    # m/s^2
    angular_accel: 3.0   # rad/s^2
    deadman_timeout: 0.6 # s; robot stops if no movement key arrives (0 disables)
    publish_rate: 20.0
